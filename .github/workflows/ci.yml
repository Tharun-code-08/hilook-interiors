name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the in-flight run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: site

jobs:
  verify:
    name: Typecheck, lint & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci

      # FRAME_COUNT is generated from the frame count of public/hero.mp4 and
      # checked against public/frames. Running it first means a short or padded
      # frame set fails here rather than silently shipping a hero that scrubs
      # into footage that is not the film.
      - name: Generate frame manifest
        run: npm run frames:manifest

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit & integration tests
        run: npm run test

  e2e:
    name: End-to-end & accessibility
    runs-on: ubuntu-latest
    # No point spinning up browsers if the code doesn't compile.
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run e2e and axe checks
        run: npm run test:e2e -- --project=chromium
        env:
          # playwright.config.ts starts the server itself with a throwaway
          # database; these only need to exist, not be secret.
          CI: "true"

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: site/playwright-report/
          retention-days: 7

  lighthouse:
    name: Lighthouse budgets & audits
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci

      # lighthouserc.js starts its own production server on port 3101 with a
      # throwaway database. ubuntu-latest ships Chrome, which chrome-launcher
      # finds on its own.
      - name: Run Lighthouse CI
        run: npm run lhci

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: lighthouse-report
          path: site/.lighthouseci/
          retention-days: 7

  build:
    name: Production build
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          # A build must not depend on production credentials. The app resolves
          # its session secret lazily so this is only here to keep the runtime
          # warning quiet during static generation.
          SESSION_SECRET: ci-build-only-secret-0123456789abcdef
          NEXT_PUBLIC_SITE_URL: https://example.com
